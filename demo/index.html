<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard vận hành — Queen · Star</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef2ef;
      --ink: #14201b;
      --muted: #5a6a63;
      --line: #c5d0ca;
      --queen: #c9b8e8;
      --star: #f5b8c8;
      --kitchen: #f0d25c;
      --floor: #9fd49a;
      --crew: #8ec8e8;
      --urgent: #e04538;
      --urgent-bg: #fff1ef;
      --card: #ffffff;
      --panel: #f7faf8;
      --tag: #f5d76e;
      --tag-text: #3d3510;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f3f7f4 0%, #e5ece8 100%);
      min-height: 100vh;
      line-height: 1.35;
    }

    .demo-banner {
      background: #1f3d32;
      color: #e8f2ed;
      font-size: 0.75rem;
      text-align: center;
      padding: 7px 10px;
    }
    .demo-banner strong { color: #f5d76e; }

    .wrap {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto;
      padding: 16px 0 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* —— Header —— */
    .app-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-family: Outfit, sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand span {
      display: block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }
    .head-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .live-clock {
      font-family: Outfit, sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      text-align: right;
      line-height: 1;
    }
    .live-clock small {
      display: block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
    }
    .head-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-soft {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
    }
    .btn-soft:hover { background: #f0f5f2; }
    .sync-label { font-size: 0.75rem; color: var(--muted); }

    /* —— Urgent strip —— */
    .urgent-strip {
      background: var(--urgent-bg);
      border: 1px solid #f5c4be;
      border-left: 5px solid var(--urgent);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 14px;
      align-items: center;
      min-height: 52px;
    }
    .urgent-label {
      font-family: Outfit, sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      background: var(--urgent);
      padding: 6px 10px;
      border-radius: 8px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .urgent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    .urgent-chip {
      font: inherit;
      border: 1px solid #f0b2ab;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .urgent-chip:hover { border-color: var(--urgent); }
    .urgent-chip .who {
      color: var(--muted);
      font-weight: 500;
      margin-left: 6px;
    }
    .urgent-empty {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* —— KPI —— */
    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }
    .kpi-date {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      background: var(--tag);
      color: var(--tag-text);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #e6c84a;
    }
    .kpi-date input[type="date"] {
      font: inherit;
      font-size: 0.85rem;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .kpi-ships {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .kpi-ship {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 280px;
    }
    .ship-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .ship-badge.queen { background: var(--queen); }
    .ship-badge.star { background: var(--star); }
    .kpi-shift {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff8dc;
      border: 1px solid #ead98a;
      border-radius: 10px;
      padding: 6px 8px;
      flex: 1;
      min-width: 150px;
    }
    .kpi-shift .sh {
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--tag-text);
      opacity: 0.75;
    }
    .kpi-shift .stat {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .kpi-shift .stat b {
      font-family: Outfit, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .kpi-shift .stat span {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 600;
    }
    .kpi-shift .sep {
      width: 1px;
      height: 28px;
      background: #e5d89a;
      margin: 0 2px;
    }

    /* —— Board: 3 rows (dept) × 2 cols (ship) —— */
    .board-head {
      display: grid;
      grid-template-columns: 88px 1fr 1fr;
      gap: 10px;
      align-items: center;
    }
    .board-head .col-title {
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .board-head .col-title.queen { background: var(--queen); }
    .board-head .col-title.star { background: var(--star); }
    .board-head .corner {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-columns: 88px 1fr 1fr;
      grid-template-rows: repeat(3, minmax(140px, 1fr));
      gap: 10px;
      min-height: 420px;
    }

    .row-label {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 8px 6px;
      border-radius: var(--radius);
      writing-mode: horizontal-tb;
      line-height: 1.25;
    }
    .row-label.kitchen { background: var(--kitchen); }
    .row-label.floor { background: var(--floor); }
    .row-label.crew { background: var(--crew); }

    .cell {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .cell-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .cell-head .meta {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .cell-head button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px dashed var(--muted);
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 7px;
      cursor: pointer;
    }
    .cell-head button:hover { color: var(--ink); border-color: var(--ink); }

    .threads {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .post {
      width: 100%;
      text-align: left;
      font: inherit;
      background: var(--panel);
      border: 1px solid #d7e0db;
      border-radius: 9px;
      padding: 8px 10px;
      cursor: pointer;
      color: inherit;
      flex-shrink: 0;
    }
    .post:hover { border-color: #a9bdb4; background: #fff; }
    .post.urgent {
      background: #fff7f6;
      border-color: #f0b8b2;
      border-left: 3px solid var(--urgent);
    }
    .post-title {
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      gap: 6px;
      align-items: flex-start;
      line-height: 1.3;
    }
    .post-title > span:last-child {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      flex-shrink: 0;
      background: var(--urgent);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.03em;
      margin-top: 1px;
    }
    .post-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .empty {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 10px 6px;
      text-align: center;
    }

    /* —— Modal —— */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 20, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      width: min(560px, 100%);
      max-height: min(86vh, 720px);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h3 { font-size: 1.05rem; font-weight: 800; }
    .modal-head .sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .modal-head .close {
      border: none;
      background: #eef2ef;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .bubble {
      background: #f4f7f5;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }
    .bubble.op { background: #fff8e0; border: 1px solid #efe3a8; }
    .bubble .who {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal-foot {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .modal-foot textarea,
    .compose-fields input,
    .compose-fields textarea {
      font: inherit;
      font-size: 0.9rem;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      width: 100%;
    }
    .modal-foot textarea { min-height: 64px; resize: vertical; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    .btn.primary {
      background: #1f3d32;
      border-color: #1f3d32;
      color: #fff;
    }
    .compose-fields { display: grid; gap: 8px; padding: 12px 16px; }
    .compose-fields label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }
    .compose-fields textarea { min-height: 90px; resize: vertical; }
    .check-urgent {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .check-urgent input {
      width: 18px;
      height: 18px;
      accent-color: var(--urgent);
    }

    @media (max-width: 900px) {
      .board-head, .board {
        grid-template-columns: 1fr;
      }
      .board { grid-template-rows: none; }
      .row-label { justify-content: flex-start; padding: 8px 12px; }
      .board-head .col-title:first-of-type { display: none; }
      .board-head .corner { display: none; }
    }

    /* ========== TV WALLBOARD ========== */
    body.tv {
      height: 100vh;
      overflow: hidden;
      background: #e8efe9;
    }
    body.tv .demo-banner { display: none; }
    body.tv .wrap {
      width: 100%;
      max-width: none;
      height: 100vh;
      margin: 0;
      padding: 14px 22px 16px;
      gap: 10px;
      overflow: hidden;
    }
    body.tv .brand { font-size: 2rem; }
    body.tv .brand span { font-size: 0.9rem; }
    body.tv .live-clock { font-size: 2.2rem; }
    body.tv .live-clock small { font-size: 0.88rem; }
    body.tv .btn-soft { font-size: 0.88rem; padding: 8px 14px; }
    body.tv .sync-label { font-size: 0.88rem; }

    body.tv .urgent-strip { padding: 10px 14px; flex-shrink: 0; }
    body.tv .urgent-label { font-size: 1rem; padding: 8px 12px; }
    body.tv .urgent-chip { font-size: 0.95rem; padding: 8px 14px; max-width: 42vw; }

    body.tv .kpi { flex-shrink: 0; padding: 8px 12px; }
    body.tv .kpi-shift .stat b { font-size: 1.35rem; }
    body.tv .kpi-shift .stat span { font-size: 0.72rem; }
    body.tv .ship-badge { font-size: 0.9rem; }

    body.tv .board-head { flex-shrink: 0; }
    body.tv .board-head .col-title { font-size: 1.1rem; padding: 8px; }
    body.tv .board {
      flex: 1 1 auto;
      min-height: 0;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    body.tv .row-label { font-size: 1rem; }
    body.tv .cell { padding: 10px; }
    body.tv .cell-head .meta { font-size: 0.85rem; }
    body.tv .cell-head button { font-size: 0.85rem; padding: 5px 10px; }
    body.tv .post { padding: 10px 12px; }
    body.tv .post-title { font-size: 1.05rem; }
    body.tv .post-meta { font-size: 0.85rem; }
    body.tv .badge { font-size: 0.72rem; padding: 3px 7px; }
    body.tv .modal { width: min(720px, 92vw); }
    body.tv .modal-head h3 { font-size: 1.3rem; }
    body.tv .bubble { font-size: 1.05rem; }

    @media (min-width: 2400px) and (min-height: 1300px) {
      body.tv .wrap { padding: 18px 32px 20px; gap: 12px; }
      body.tv .brand { font-size: 2.35rem; }
      body.tv .live-clock { font-size: 2.6rem; }
      body.tv .urgent-chip { font-size: 1.05rem; }
      body.tv .kpi-shift .stat b { font-size: 1.55rem; }
      body.tv .post-title { font-size: 1.15rem; }
      body.tv .row-label { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="demo-banner">
    <strong>DEMO</strong> — wallboard tối ưu cho Tivi · thêm <code>?tv=1</code> hoặc bấm “Chế độ Tivi”
  </div>

  <div class="wrap">
    <header class="app-head">
      <div class="brand">
        Queen · Star
        <span>Tổng quan vận hành & báo cáo nội bộ</span>
      </div>
      <div class="head-right">
        <div>
          <div class="sync-label">Sheet sync: <span id="syncTime">—</span></div>
          <div class="live-clock" style="margin-top:4px">
            <div id="clockTime">--:--</div>
            <small id="clockDate">—</small>
          </div>
        </div>
        <div class="head-actions">
          <button type="button" class="btn-soft" id="btnRefresh">Làm mới</button>
          <button type="button" class="btn-soft" id="btnTv">Chế độ Tivi</button>
        </div>
      </div>
    </header>

    <section class="urgent-strip" aria-label="Việc gấp">
      <div class="urgent-label">GẤP</div>
      <div class="urgent-list" id="urgentList"></div>
    </section>

    <section class="kpi" aria-label="Số liệu khách">
      <div class="kpi-date">
        <span class="pill">Ngày</span>
        <input type="date" id="datePick" />
      </div>
      <div class="kpi-ships" id="kpiShips"></div>
    </section>

    <div class="board-head" aria-hidden="true">
      <div class="corner">Bộ phận</div>
      <div class="col-title queen">Queen</div>
      <div class="col-title star">Star</div>
    </div>

    <section class="board" aria-label="Báo cáo theo bộ phận">
      <div class="row-label kitchen">Bếp</div>
      <div class="cell" data-ship="Queen" data-dept="kitchen">
        <div class="cell-head">
          <span class="meta">Queen · Bếp</span>
          <button type="button" data-compose="Queen|kitchen">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Queen-kitchen"></div>
      </div>
      <div class="cell" data-ship="Star" data-dept="kitchen">
        <div class="cell-head">
          <span class="meta">Star · Bếp</span>
          <button type="button" data-compose="Star|kitchen">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Star-kitchen"></div>
      </div>

      <div class="row-label floor">Bàn</div>
      <div class="cell" data-ship="Queen" data-dept="floor">
        <div class="cell-head">
          <span class="meta">Queen · Bàn</span>
          <button type="button" data-compose="Queen|floor">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Queen-floor"></div>
      </div>
      <div class="cell" data-ship="Star" data-dept="floor">
        <div class="cell-head">
          <span class="meta">Star · Bàn</span>
          <button type="button" data-compose="Star|floor">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Star-floor"></div>
      </div>

      <div class="row-label crew">Thuỷ thủ</div>
      <div class="cell" data-ship="Queen" data-dept="crew">
        <div class="cell-head">
          <span class="meta">Queen · Thuỷ thủ</span>
          <button type="button" data-compose="Queen|crew">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Queen-crew"></div>
      </div>
      <div class="cell" data-ship="Star" data-dept="crew">
        <div class="cell-head">
          <span class="meta">Star · Thuỷ thủ</span>
          <button type="button" data-compose="Star|crew">+ Gửi</button>
        </div>
        <div class="threads" id="ch-Star-crew"></div>
      </div>
    </section>
  </div>

  <div class="overlay" id="threadOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3 id="threadTitle">—</h3>
          <div class="sub" id="threadSub"></div>
        </div>
        <button type="button" class="close" data-close aria-label="Đóng">×</button>
      </div>
      <div class="modal-body" id="threadReplies"></div>
      <div class="modal-foot">
        <textarea id="replyText" placeholder="Viết phản hồi..."></textarea>
        <div class="actions">
          <button type="button" class="btn" data-close>Đóng</button>
          <button type="button" class="btn primary" id="btnReply">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="composeOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>Gửi báo cáo</h3>
          <div class="sub" id="composeSub"></div>
        </div>
        <button type="button" class="close" data-close-compose aria-label="Đóng">×</button>
      </div>
      <div class="compose-fields">
        <div>
          <label for="composeTitle">Tiêu đề</label>
          <input id="composeTitle" type="text" placeholder="VD: Thiếu nguyên liệu gà" />
        </div>
        <div>
          <label for="composeBody">Nội dung</label>
          <textarea id="composeBody" placeholder="Mô tả tình trạng / cần hỗ trợ..."></textarea>
        </div>
        <label class="check-urgent">
          <input type="checkbox" id="composeUrgent" />
          Đánh dấu <strong style="color:var(--urgent)">Gấp</strong>
        </label>
      </div>
      <div class="modal-foot">
        <div class="actions">
          <button type="button" class="btn" data-close-compose>Hủy</button>
          <button type="button" class="btn primary" id="btnCompose">Đăng</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEPT_LABEL = {
      kitchen: "Bếp",
      floor: "Bàn",
      crew: "Thuỷ thủ",
    };

    const occupancy = {
      Queen: {
        T1: { guests: 128, capacity: 150 },
        T2: { guests: 96, capacity: 150 },
      },
      Star: {
        T1: { guests: 142, capacity: 160 },
        T2: { guests: 110, capacity: 160 },
      },
    };

    let posts = [
      {
        id: "p1", ship: "Queen", dept: "kitchen",
        title: "Hết sốt tiêu — cần bổ sung trước 17h",
        body: "Tồn kho sốt tiêu còn khoảng 2 chai. Dự kiến T2 sẽ thiếu nếu không nhập thêm.",
        urgent: true, author: "Bếp · Lan", time: "14:05",
        replies: [
          { author: "Kho · Minh", time: "14:12", text: "Đã đặt thêm, giao ~16:30." },
          { author: "Bếp · Lan", time: "14:15", text: "Ok, cảm ơn." },
        ],
      },
      {
        id: "p2", ship: "Queen", dept: "floor",
        title: "Bàn 12 yêu cầu đổi vị trí (gần cửa sổ)",
        body: "Khách đoàn 6 người muốn chuyển gần cửa sổ nếu còn chỗ.",
        urgent: false, author: "Bàn · Hùng", time: "13:40",
        replies: [{ author: "Bàn · Mai", time: "13:44", text: "Bàn 3 vừa trống — đã chuyển." }],
      },
      {
        id: "p3", ship: "Queen", dept: "crew",
        title: "Check dây buộc mạn phải OK",
        body: "Đã kiểm tra dây buộc ca chiều, tình trạng bình thường.",
        urgent: false, author: "TT · Long", time: "12:20", replies: [],
      },
      {
        id: "p4", ship: "Star", dept: "kitchen",
        title: "Lò nướng 2 nhiệt không ổn định",
        body: "Nhiệt dao động ±30°C. Đang dùng lò 1 bù. Cần kỹ thuật xem trước T2.",
        urgent: true, author: "Bếp · Tuấn", time: "13:55",
        replies: [{ author: "KT · Phong", time: "14:02", text: "Đang xuống Star, ETA 10 phút." }],
      },
      {
        id: "p5", ship: "Star", dept: "floor",
        title: "Đủ set menu T1 — không phát sinh",
        body: "T1 chạy ổn. Còn 8 set dự phòng.",
        urgent: false, author: "Bàn · Nga", time: "12:50", replies: [],
      },
      {
        id: "p6", ship: "Star", dept: "crew",
        title: "Rò rỉ nhẹ khu vực cầu thang 2",
        body: "Phát hiện ẩm sàn cầu thang 2. Đã chắn tạm, cần bảo trì kiểm tra ống.",
        urgent: true, author: "TT · Khoa", time: "14:18", replies: [],
      },
      {
        id: "p7", ship: "Queen", dept: "kitchen",
        title: "Buffet tráng miệng đã setup xong",
        body: "Kệ tráng miệng tầng 2 sẵn sàng trước giờ đón khách.",
        urgent: false, author: "Bếp · Hà", time: "13:10", replies: [],
      },
      {
        id: "p8", ship: "Star", dept: "floor",
        title: "Thiếu 2 ghế phụ tầng 1",
        body: "Đoàn 12 khách, cần thêm 2 ghế phụ gần cửa sổ.",
        urgent: true, author: "Bàn · Vy", time: "14:22", replies: [],
      },
      {
        id: "p9", ship: "Queen", dept: "floor",
        title: "Khách VIP tầng 2 đã check-in đủ",
        body: "Đoàn 8 khách VIP đã ngồi bàn, không phát sinh.",
        urgent: false, author: "Bàn · My", time: "14:00", replies: [],
      },
      {
        id: "p10", ship: "Queen", dept: "crew",
        title: "Đèn sàn hành lang đã thay xong",
        body: "Thay 2 bóng LED hành lang mạn trái.",
        urgent: false, author: "TT · Nam", time: "13:05", replies: [],
      },
      {
        id: "p11", ship: "Star", dept: "kitchen",
        title: "Nhập thêm rau sống cho T2",
        body: "Kho đã giao 3 thùng rau sống, bếp nhận đủ.",
        urgent: false, author: "Bếp · Oanh", time: "13:20", replies: [],
      },
      {
        id: "p12", ship: "Star", dept: "crew",
        title: "Ca trực boong đã bàn giao",
        body: "Bàn giao ca chiều, thiết bị cứu sinh đủ.",
        urgent: false, author: "TT · Hải", time: "13:30", replies: [],
      },
    ];

    let activePostId = null;
    let composeTarget = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pct(g, c) {
      return c ? Math.round((g / c) * 100) + "%" : "—";
    }

    function postsLimit() {
      return document.body.classList.contains("tv") ? 2 : 4;
    }

    function sortedChannel(ship, dept) {
      return posts
        .filter((p) => p.ship === ship && p.dept === dept)
        .sort((a, b) => (a.urgent === b.urgent ? 0 : a.urgent ? -1 : 1));
    }

    function renderKpi() {
      const root = document.getElementById("kpiShips");
      root.innerHTML = ["Queen", "Star"]
        .map((ship) => {
          const shifts = ["T1", "T2"]
            .map((sh) => {
              const { guests, capacity } = occupancy[ship][sh];
              const empty = Math.max(0, capacity - guests);
              return `
              <div class="kpi-shift">
                <div class="sh">${sh}</div>
                <div class="stat"><b>${guests}</b><span>Khách</span></div>
                <div class="sep"></div>
                <div class="stat"><b>${empty}</b><span>Trống</span></div>
                <div class="sep"></div>
                <div class="stat"><b>${pct(guests, capacity)}</b><span>Lấp đầy</span></div>
              </div>`;
            })
            .join("");
          return `
            <div class="kpi-ship">
              <span class="ship-badge ${ship.toLowerCase()}">${ship}</span>
              ${shifts}
            </div>`;
        })
        .join("");
    }

    function renderUrgent() {
      const list = document.getElementById("urgentList");
      const urgents = posts.filter((p) => p.urgent);
      if (!urgents.length) {
        list.innerHTML = `<div class="urgent-empty">Không có việc gấp lúc này</div>`;
        return;
      }
      list.innerHTML = urgents
        .map(
          (p) => `
        <button type="button" class="urgent-chip" data-open="${p.id}">
          ${escapeHtml(p.ship)} · ${DEPT_LABEL[p.dept]}: ${escapeHtml(p.title)}
          <span class="who">${escapeHtml(p.author)} · ${p.time}</span>
        </button>`
        )
        .join("");
    }

    function renderChannels() {
      const limit = postsLimit();
      ["Queen", "Star"].forEach((ship) => {
        ["kitchen", "floor", "crew"].forEach((dept) => {
          const box = document.getElementById(`ch-${ship}-${dept}`);
          const list = sortedChannel(ship, dept).slice(0, limit);
          if (!list.length) {
            box.innerHTML = `<div class="empty">Chưa có báo cáo</div>`;
            return;
          }
          box.innerHTML = list
            .map(
              (p) => `
            <button type="button" class="post ${p.urgent ? "urgent" : ""}" data-open="${p.id}">
              <div class="post-title">
                ${p.urgent ? '<span class="badge">Gấp</span>' : ""}
                <span>${escapeHtml(p.title)}</span>
              </div>
              <div class="post-meta">${escapeHtml(p.author)} · ${p.time} · ${p.replies.length} phản hồi</div>
            </button>`
            )
            .join("");
        });
      });
    }

    function renderAll() {
      renderKpi();
      renderUrgent();
      renderChannels();
    }

    function stampSync() {
      document.getElementById("syncTime").textContent = new Date().toLocaleTimeString("vi-VN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function tickClock() {
      const now = new Date();
      document.getElementById("clockTime").textContent = now.toLocaleTimeString("vi-VN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
      document.getElementById("clockDate").textContent = now.toLocaleDateString("vi-VN", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
    }

    function openThread(id) {
      const p = posts.find((x) => x.id === id);
      if (!p) return;
      activePostId = id;
      document.getElementById("threadTitle").textContent = p.title;
      document.getElementById("threadSub").textContent =
        `${p.ship} · ${DEPT_LABEL[p.dept]} · ${p.author} · ${p.time}` +
        (p.urgent ? " · GẤP" : "");
      document.getElementById("threadReplies").innerHTML = `
        <div class="bubble op">
          <div class="who">${escapeHtml(p.author)} · ${p.time}</div>
          <div>${escapeHtml(p.body)}</div>
        </div>
        ${p.replies
          .map(
            (r) => `
          <div class="bubble">
            <div class="who">${escapeHtml(r.author)} · ${r.time}</div>
            <div>${escapeHtml(r.text)}</div>
          </div>`
          )
          .join("")}`;
      document.getElementById("replyText").value = "";
      document.getElementById("threadOverlay").classList.add("open");
    }

    function openCompose(ship, dept) {
      composeTarget = { ship, dept };
      document.getElementById("composeSub").textContent = `${ship} · ${DEPT_LABEL[dept]}`;
      document.getElementById("composeTitle").value = "";
      document.getElementById("composeBody").value = "";
      document.getElementById("composeUrgent").checked = false;
      document.getElementById("composeOverlay").classList.add("open");
    }

    function closeOverlays() {
      document.getElementById("threadOverlay").classList.remove("open");
      document.getElementById("composeOverlay").classList.remove("open");
      activePostId = null;
      composeTarget = null;
    }

    function setTvMode(on, persist) {
      document.body.classList.toggle("tv", on);
      document.getElementById("btnTv").textContent = on ? "Thoát chế độ Tivi" : "Chế độ Tivi";
      if (persist) {
        const url = new URL(location.href);
        if (on) url.searchParams.set("tv", "1");
        else url.searchParams.delete("tv");
        history.replaceState(null, "", url);
      }
      renderChannels();
    }

    function shouldAutoTv() {
      const q = new URLSearchParams(location.search);
      if (q.get("tv") === "1") return true;
      if (q.get("tv") === "0") return false;
      return window.innerWidth >= 1920 && window.innerHeight >= 1000;
    }

    document.getElementById("btnRefresh").addEventListener("click", () => {
      Object.keys(occupancy).forEach((ship) => {
        ["T1", "T2"].forEach((shift) => {
          const o = occupancy[ship][shift];
          o.guests = Math.max(0, Math.min(o.capacity, o.guests + Math.floor(Math.random() * 7) - 3));
        });
      });
      renderKpi();
      stampSync();
    });

    document.getElementById("btnTv").addEventListener("click", () => {
      setTvMode(!document.body.classList.contains("tv"), true);
    });

    document.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) openThread(open.getAttribute("data-open"));

      const compose = e.target.closest("[data-compose]");
      if (compose) {
        const [ship, dept] = compose.getAttribute("data-compose").split("|");
        openCompose(ship, dept);
      }

      if (e.target.matches("[data-close]") || e.target.id === "threadOverlay") {
        if (e.target.id === "threadOverlay" || e.target.matches("[data-close]")) {
          document.getElementById("threadOverlay").classList.remove("open");
          activePostId = null;
        }
      }
      if (e.target.matches("[data-close-compose]") || e.target.id === "composeOverlay") {
        if (e.target.id === "composeOverlay" || e.target.matches("[data-close-compose]")) {
          document.getElementById("composeOverlay").classList.remove("open");
          composeTarget = null;
        }
      }
    });

    document.getElementById("btnReply").addEventListener("click", () => {
      const text = document.getElementById("replyText").value.trim();
      if (!text || !activePostId) return;
      const p = posts.find((x) => x.id === activePostId);
      p.replies.push({
        author: "Bạn (demo)",
        time: new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }),
        text,
      });
      openThread(activePostId);
      renderAll();
    });

    document.getElementById("btnCompose").addEventListener("click", () => {
      if (!composeTarget) return;
      const title = document.getElementById("composeTitle").value.trim();
      const body = document.getElementById("composeBody").value.trim();
      if (!title || !body) {
        alert("Nhập tiêu đề và nội dung.");
        return;
      }
      posts.unshift({
        id: "p" + Date.now(),
        ship: composeTarget.ship,
        dept: composeTarget.dept,
        title,
        body,
        urgent: document.getElementById("composeUrgent").checked,
        author: "Bạn (demo)",
        time: new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }),
        replies: [],
      });
      closeOverlays();
      renderAll();
    });

    document.getElementById("datePick").value = new Date().toISOString().slice(0, 10);
    setTvMode(shouldAutoTv(), false);
    renderAll();
    stampSync();
    tickClock();
    setInterval(tickClock, 1000);

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!new URLSearchParams(location.search).has("tv")) setTvMode(shouldAutoTv(), false);
      }, 200);
    });
  </script>
</body>
</html>
