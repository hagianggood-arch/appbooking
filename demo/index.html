<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard vận hành — Queen · Star</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8efe9;
      --ink: #14201b;
      --muted: #5a6a63;
      --line: #c5d0ca;
      --queen: #c9b8e8;
      --star: #f5b8c8;
      --ship3: #b8d4f0;
      --ship4: #d4c4a8;
      --kitchen: #f0d25c;
      --floor: #9fd49a;
      --crew: #8ec8e8;
      --office: #d7dde8;
      --urgent: #e04538;
      --urgent-bg: #fff1ef;
      --card: #ffffff;
      --panel: #f7faf8;
      --tag: #f5d76e;
      --tag-text: #3d3510;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f3f7f4 0%, #e5ece8 100%);
      min-height: 100vh;
      line-height: 1.35;
    }

    .demo-banner {
      background: #1f3d32;
      color: #e8f2ed;
      font-size: 0.75rem;
      text-align: center;
      padding: 7px 10px;
    }
    .demo-banner strong { color: #f5d76e; }

    .wrap {
      width: min(1100px, calc(100% - 24px));
      margin: 0 auto;
      padding: 16px 0 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-family: Outfit, sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand span {
      display: block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }
    .head-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .live-clock {
      font-family: Outfit, sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      text-align: right;
      line-height: 1;
    }
    .live-clock small {
      display: block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
    }
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-soft {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
    }
    .btn-soft:hover { background: #f0f5f2; }
    .sync-label { font-size: 0.75rem; color: var(--muted); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 12px;
    }
    .pill {
      background: var(--tag);
      color: var(--tag-text);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #e6c84a;
    }
    .toolbar input[type="date"] {
      font: inherit;
      font-size: 0.85rem;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    /* Urgent */
    .urgent-strip {
      background: var(--urgent-bg);
      border: 1px solid #f5c4be;
      border-left: 5px solid var(--urgent);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 14px;
      align-items: center;
    }
    .urgent-label {
      font-family: Outfit, sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      background: var(--urgent);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .urgent-list { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
    .urgent-chip {
      font: inherit;
      border: 1px solid #f0b2ab;
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .urgent-chip .who { color: var(--muted); font-weight: 500; margin-left: 6px; }
    .urgent-empty { font-size: 0.88rem; color: var(--muted); }

    /* Office */
    .office {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .office-head,
    .ship-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .office-head {
      background: linear-gradient(90deg, #e8ecf4, #f5f7fa);
    }
    .office-head h2,
    .ship-head h2 {
      font-family: Outfit, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-soft {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--office);
      color: var(--ink);
    }
    .toggle-btn {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .office-body,
    .ship-body {
      padding: 0 12px 12px;
      display: none;
    }
    .office.open .office-body,
    .ship.open .ship-body { display: block; }

    .channel-block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
    }
    .channel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .channel-tag {
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .channel-tag.office { background: var(--office); }
    .channel-tag.kitchen { background: var(--kitchen); }
    .channel-tag.floor { background: var(--floor); }
    .channel-tag.crew { background: var(--crew); }
    .channel-head button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px dashed var(--muted);
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 7px;
      cursor: pointer;
    }

    .threads { display: flex; flex-direction: column; gap: 6px; }
    .post {
      width: 100%;
      text-align: left;
      font: inherit;
      background: #fff;
      border: 1px solid #d7e0db;
      border-radius: 9px;
      padding: 8px 10px;
      cursor: pointer;
      color: inherit;
    }
    .post:hover { border-color: #a9bdb4; }
    .post.urgent {
      background: #fff7f6;
      border-color: #f0b8b2;
      border-left: 3px solid var(--urgent);
    }
    .post-title {
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      gap: 6px;
      align-items: flex-start;
      line-height: 1.3;
    }
    .post-title > span:last-child {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      flex-shrink: 0;
      background: var(--urgent);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 1px;
    }
    .post-meta { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
    .empty { font-size: 0.8rem; color: var(--muted); padding: 10px 6px; text-align: center; }

    /* Ships stack */
    .ships-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ship {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .ship-head.queen { background: linear-gradient(90deg, #ebe4f7, #faf8fd); }
    .ship-head.star { background: linear-gradient(90deg, #fde8ef, #fffafb); }
    .ship-head.pearl { background: linear-gradient(90deg, #e4eef8, #f7fbfe); }
    .ship-head.jade { background: linear-gradient(90deg, #ebe4d8, #faf7f2); }

    .ship-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .ship-badge.queen { background: var(--queen); }
    .ship-badge.star { background: var(--star); }
    .ship-badge.pearl { background: var(--ship3); }
    .ship-badge.jade { background: var(--ship4); }

    .zones {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .zone-row {
      display: grid;
      grid-template-columns: 88px repeat(3, 1fr);
      gap: 6px;
      align-items: stretch;
    }
    .zone-name {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.78rem;
      background: #fff8dc;
      border: 1px solid #ead98a;
      border-radius: 9px;
      color: var(--tag-text);
      padding: 6px;
      text-align: center;
    }
    .zone-stat {
      background: #fff8dc;
      border: 1px solid #ead98a;
      border-radius: 9px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 44px;
    }
    .zone-stat b {
      font-family: Outfit, sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .zone-stat span {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--muted);
    }

    .dept-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (max-width: 800px) {
      .zone-row { grid-template-columns: 72px repeat(3, 1fr); }
      .dept-grid { grid-template-columns: 1fr; }
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 20, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      width: min(560px, 100%);
      max-height: min(86vh, 720px);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h3 { font-size: 1.05rem; font-weight: 800; }
    .modal-head .sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .modal-head .close {
      border: none;
      background: #eef2ef;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .bubble {
      background: #f4f7f5;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }
    .bubble.op { background: #fff8e0; border: 1px solid #efe3a8; }
    .bubble .who {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal-foot {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .modal-foot textarea,
    .compose-fields input,
    .compose-fields textarea {
      font: inherit;
      font-size: 0.9rem;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      width: 100%;
    }
    .modal-foot textarea { min-height: 64px; resize: vertical; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    .btn.primary {
      background: #1f3d32;
      border-color: #1f3d32;
      color: #fff;
    }
    .compose-fields { display: grid; gap: 8px; padding: 12px 16px; }
    .compose-fields label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }
    .compose-fields textarea { min-height: 90px; resize: vertical; }
    .check-urgent {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .check-urgent input {
      width: 18px;
      height: 18px;
      accent-color: var(--urgent);
    }

    /* TV */
    body.tv {
      height: 100vh;
      overflow: hidden;
      background: #e8efe9;
    }
    body.tv .demo-banner { display: none; }
    body.tv .wrap {
      width: 100%;
      max-width: none;
      height: 100vh;
      margin: 0;
      padding: 12px 20px 14px;
      gap: 10px;
      overflow: hidden;
    }
    body.tv .brand { font-size: 1.85rem; }
    body.tv .live-clock { font-size: 2rem; }
    body.tv .ships-stack {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      gap: 10px;
    }
    body.tv .zone-stat b { font-size: 1.25rem; }
    body.tv .post-title { font-size: 0.98rem; }
    body.tv .ship-head h2,
    body.tv .office-head h2 { font-size: 1.15rem; }
    body.tv .dept-grid { gap: 10px; }
    /* On TV: collapse less-critical ships by default via JS */
  </style>
</head>
<body>
  <div class="demo-banner">
    <strong>DEMO</strong> — tàu xếp dọc · khu/tầng đúng cấu trúc khách · Văn phòng + Ẩn/Hiện · <code>?tv=1</code>
  </div>

  <div class="wrap">
    <header class="app-head">
      <div class="brand">
        Queen · Star
        <span>Tổng quan vận hành · sẵn sàng 4 tàu</span>
      </div>
      <div class="head-right">
        <div>
          <div class="sync-label">Sheet sync: <span id="syncTime">—</span></div>
          <div class="live-clock" style="margin-top:4px">
            <div id="clockTime">--:--</div>
            <small id="clockDate">—</small>
          </div>
        </div>
        <div class="head-actions">
          <button type="button" class="btn-soft" id="btnExpandAll">Mở tất cả</button>
          <button type="button" class="btn-soft" id="btnCollapseAll">Thu gọn</button>
          <button type="button" class="btn-soft" id="btnRefresh">Làm mới</button>
          <button type="button" class="btn-soft" id="btnTv">Chế độ Tivi</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <span class="pill">Ngày</span>
      <input type="date" id="datePick" />
    </div>

    <section class="urgent-strip" aria-label="Việc gấp">
      <div class="urgent-label">GẤP</div>
      <div class="urgent-list" id="urgentList"></div>
    </section>

    <section class="office open" id="officeBlock">
      <div class="office-head" data-toggle="officeBlock">
        <h2>Văn phòng <span class="badge-soft">Nội bộ</span></h2>
        <button type="button" class="toggle-btn" id="officeToggle">Ẩn</button>
      </div>
      <div class="office-body">
        <div class="channel-block">
          <div class="channel-head">
            <span class="channel-tag office">Kênh văn phòng</span>
            <button type="button" data-compose="office|office">+ Gửi</button>
          </div>
          <div class="threads" id="ch-office-office"></div>
        </div>
      </div>
    </section>

    <div class="ships-stack" id="shipsStack"></div>
  </div>

  <div class="overlay" id="threadOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3 id="threadTitle">—</h3>
          <div class="sub" id="threadSub"></div>
        </div>
        <button type="button" class="close" data-close aria-label="Đóng">×</button>
      </div>
      <div class="modal-body" id="threadReplies"></div>
      <div class="modal-foot">
        <textarea id="replyText" placeholder="Viết phản hồi..."></textarea>
        <div class="actions">
          <button type="button" class="btn" data-close>Đóng</button>
          <button type="button" class="btn primary" id="btnReply">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="composeOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>Gửi báo cáo</h3>
          <div class="sub" id="composeSub"></div>
        </div>
        <button type="button" class="close" data-close-compose aria-label="Đóng">×</button>
      </div>
      <div class="compose-fields">
        <div>
          <label for="composeTitle">Tiêu đề</label>
          <input id="composeTitle" type="text" placeholder="VD: Thiếu nguyên liệu gà" />
        </div>
        <div>
          <label for="composeBody">Nội dung</label>
          <textarea id="composeBody" placeholder="Mô tả tình trạng / cần hỗ trợ..."></textarea>
        </div>
        <label class="check-urgent">
          <input type="checkbox" id="composeUrgent" />
          Đánh dấu <strong style="color:var(--urgent)">Gấp</strong>
        </label>
      </div>
      <div class="modal-foot">
        <div class="actions">
          <button type="button" class="btn" data-close-compose>Hủy</button>
          <button type="button" class="btn primary" id="btnCompose">Đăng</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /** Config — thêm tàu / khu / bộ phận chỉ sửa ở đây */
    const DEPARTMENTS = [
      { id: "kitchen", label: "Bếp", className: "kitchen" },
      { id: "floor", label: "Bàn", className: "floor" },
      { id: "crew", label: "Thuỷ thủ", className: "crew" },
    ];

    const SHIPS = [
      {
        id: "queen",
        name: "Queen",
        theme: "queen",
        zones: ["Tầng 1", "Tầng 2", "Tầng 3", "VIP"],
        openDefault: true,
      },
      {
        id: "star",
        name: "Star",
        theme: "star",
        zones: ["Tầng 1", "Tầng 2", "Boong"],
        openDefault: true,
      },
      {
        id: "pearl",
        name: "Pearl",
        theme: "pearl",
        zones: ["Tầng 1", "Tầng 2", "Tầng 3"],

      },
      {
        id: "jade",
        name: "Jade",
        theme: "jade",
        zones: ["Tầng 1", "Tầng 2", "VIP"],
        openDefault: false,
      },
    ];

    /** occupancy[shipId][zone] = { guests, capacity } */
    const occupancy = {
      queen: {
        "Tầng 1": { guests: 128, capacity: 150 },
        "Tầng 2": { guests: 96, capacity: 150 },
        "Tầng 3": { guests: 110, capacity: 140 },
        VIP: { guests: 42, capacity: 48 },
      },
      star: {
        "Tầng 1": { guests: 142, capacity: 160 },
        "Tầng 2": { guests: 110, capacity: 160 },
        Boong: { guests: 28, capacity: 40 },
      },
      pearl: {
        "Tầng 1": { guests: 88, capacity: 120 },
        "Tầng 2": { guests: 76, capacity: 120 },
        "Tầng 3": { guests: 64, capacity: 100 },
      },
      jade: {
        "Tầng 1": { guests: 70, capacity: 110 },
        "Tầng 2": { guests: 55, capacity: 110 },
        VIP: { guests: 20, capacity: 30 },
      },
    };

    let posts = [
      {
        id: "o1", ship: "office", dept: "office",
        title: "Họp ca 16:00 — chốt số liệu hết chỗ tuần này",
        body: "Văn phòng họp nhanh với điều hành Queen/Star lúc 16:00 tại phòng A.",
        urgent: true, author: "VP · Giang", time: "09:10", replies: [],
      },
      {
        id: "o2", ship: "office", dept: "office",
        title: "Nhắc xuất hóa đơn đoàn ANEX còn treo",
        body: "Các booking ANEX ngày 27/09 còn công nợ — kế toán check giúp.",
        urgent: false, author: "VP · Hà", time: "08:40", replies: [],
      },
      {
        id: "p1", ship: "queen", dept: "kitchen",
        title: "Hết sốt tiêu — cần bổ sung trước 17h",
        body: "Tồn kho sốt tiêu còn khoảng 2 chai.",
        urgent: true, author: "Bếp · Lan", time: "14:05",
        replies: [{ author: "Kho · Minh", time: "14:12", text: "Đã đặt thêm, giao ~16:30." }],
      },
      {
        id: "p2", ship: "queen", dept: "floor",
        title: "Bàn 12 yêu cầu đổi vị trí (gần cửa sổ)",
        body: "Khách đoàn 6 người muốn chuyển gần cửa sổ.",
        urgent: false, author: "Bàn · Hùng", time: "13:40", replies: [],
      },
      {
        id: "p3", ship: "queen", dept: "crew",
        title: "Check dây buộc mạn phải OK",
        body: "Đã kiểm tra dây buộc ca chiều.",
        urgent: false, author: "TT · Long", time: "12:20", replies: [],
      },
      {
        id: "p4", ship: "star", dept: "kitchen",
        title: "Lò nướng 2 nhiệt không ổn định",
        body: "Nhiệt dao động ±30°C. Cần kỹ thuật xem.",
        urgent: true, author: "Bếp · Tuấn", time: "13:55", replies: [],
      },
      {
        id: "p5", ship: "star", dept: "floor",
        title: "Thiếu 2 ghế phụ tầng 1",
        body: "Đoàn 12 khách cần thêm ghế phụ.",
        urgent: true, author: "Bàn · Vy", time: "14:22", replies: [],
      },
      {
        id: "p6", ship: "star", dept: "crew",
        title: "Rò rỉ nhẹ khu vực cầu thang 2",
        body: "Đã chắn tạm, cần bảo trì kiểm tra ống.",
        urgent: true, author: "TT · Khoa", time: "14:18", replies: [],
      },
      {
        id: "p7", ship: "pearl", dept: "kitchen",
        title: "Chuẩn bị menu lễ — thiếu 1 nồi lẩu",
        body: "Cần mượn thêm nồi từ kho trung tâm.",
        urgent: false, author: "Bếp · An", time: "11:20", replies: [],
      },
      {
        id: "p8", ship: "jade", dept: "floor",
        title: "VIP yêu cầu mic họp 19:30",
        body: "Đoàn họp riêng, chuẩn bị 2 mic.",
        urgent: false, author: "Bàn · Trang", time: "10:50", replies: [],
      },
    ];

    let activePostId = null;
    let composeTarget = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pct(g, c) {
      return c ? Math.round((g / c) * 100) + "%" : "—";
    }

    function shipName(id) {
      if (id === "office") return "Văn phòng";
      return SHIPS.find((s) => s.id === id)?.name || id;
    }

    function deptLabel(id) {
      if (id === "office") return "Văn phòng";
      return DEPARTMENTS.find((d) => d.id === id)?.label || id;
    }

    function postsLimit() {
      return document.body.classList.contains("tv") ? 2 : 3;
    }

    function channelPosts(ship, dept) {
      return posts
        .filter((p) => p.ship === ship && p.dept === dept)
        .sort((a, b) => (a.urgent === b.urgent ? 0 : a.urgent ? -1 : 1));
    }

    function renderThreads(el, ship, dept) {
      const list = channelPosts(ship, dept).slice(0, postsLimit());
      if (!list.length) {
        el.innerHTML = `<div class="empty">Chưa có báo cáo</div>`;
        return;
      }
      el.innerHTML = list
        .map(
          (p) => `
        <button type="button" class="post ${p.urgent ? "urgent" : ""}" data-open="${p.id}">
          <div class="post-title">
            ${p.urgent ? '<span class="badge">Gấp</span>' : ""}
            <span>${escapeHtml(p.title)}</span>
          </div>
          <div class="post-meta">${escapeHtml(p.author)} · ${p.time} · ${p.replies.length} phản hồi</div>
        </button>`
        )
        .join("");
    }

    function renderUrgent() {
      const list = document.getElementById("urgentList");
      const urgents = posts.filter((p) => p.urgent);
      if (!urgents.length) {
        list.innerHTML = `<div class="urgent-empty">Không có việc gấp</div>`;
        return;
      }
      list.innerHTML = urgents
        .map(
          (p) => `
        <button type="button" class="urgent-chip" data-open="${p.id}">
          ${escapeHtml(shipName(p.ship))} · ${escapeHtml(deptLabel(p.dept))}: ${escapeHtml(p.title)}
          <span class="who">${escapeHtml(p.author)} · ${p.time}</span>
        </button>`
        )
        .join("");
    }

    function renderShips() {
      const root = document.getElementById("shipsStack");
      root.innerHTML = SHIPS.map((ship) => {
        const zones = (occupancy[ship.id] || {});
        const zoneRows = ship.zones
          .map((z) => {
            const o = zones[z] || { guests: 0, capacity: 0 };
            const empty = Math.max(0, o.capacity - o.guests);
            return `
              <div class="zone-row">
                <div class="zone-name">${escapeHtml(z)}</div>
                <div class="zone-stat"><b>${o.guests}</b><span>Khách</span></div>
                <div class="zone-stat"><b>${empty}</b><span>Trống</span></div>
                <div class="zone-stat"><b>${pct(o.guests, o.capacity)}</b><span>Lấp đầy</span></div>
              </div>`;
          })
          .join("");

        const depts = DEPARTMENTS.map(
          (d) => `
          <div class="channel-block">
            <div class="channel-head">
              <span class="channel-tag ${d.className}">${d.label}</span>
              <button type="button" data-compose="${ship.id}|${d.id}">+ Gửi</button>
            </div>
            <div class="threads" id="ch-${ship.id}-${d.id}"></div>
          </div>`
        ).join("");

        return `
          <article class="ship ${ship.openDefault ? "open" : ""}" id="ship-${ship.id}">
            <div class="ship-head ${ship.theme}" data-toggle="ship-${ship.id}">
              <h2>
                <span class="ship-badge ${ship.theme}">${escapeHtml(ship.name)}</span>
                <span style="font-size:0.78rem;font-weight:600;color:var(--muted)">${ship.zones.length} khu</span>
              </h2>
              <button type="button" class="toggle-btn" data-toggle-btn="ship-${ship.id}">
                ${ship.openDefault ? "Ẩn" : "Hiện"}
              </button>
            </div>
            <div class="ship-body">
              <div class="zones">${zoneRows}</div>
              <div class="dept-grid">${depts}</div>
            </div>
          </article>`;
      }).join("");

      // fill threads after DOM exists
      SHIPS.forEach((ship) => {
        DEPARTMENTS.forEach((d) => {
          const el = document.getElementById(`ch-${ship.id}-${d.id}`);
          if (el) renderThreads(el, ship.id, d.id);
        });
      });
    }

    function renderOffice() {
      renderThreads(document.getElementById("ch-office-office"), "office", "office");
    }

    function renderAll() {
      renderUrgent();
      renderOffice();
      renderShips();
      syncToggleLabels();
    }

    function setOpen(id, open) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle("open", open);
      syncToggleLabels();
    }

    function syncToggleLabels() {
      document.querySelectorAll("[data-toggle-btn]").forEach((btn) => {
        const id = btn.getAttribute("data-toggle-btn");
        const open = document.getElementById(id)?.classList.contains("open");
        btn.textContent = open ? "Ẩn" : "Hiện";
      });
      const officeOpen = document.getElementById("officeBlock")?.classList.contains("open");
      const ot = document.getElementById("officeToggle");
      if (ot) ot.textContent = officeOpen ? "Ẩn" : "Hiện";
    }

    function stampSync() {
      document.getElementById("syncTime").textContent = new Date().toLocaleTimeString("vi-VN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function tickClock() {
      const now = new Date();
      document.getElementById("clockTime").textContent = now.toLocaleTimeString("vi-VN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
      document.getElementById("clockDate").textContent = now.toLocaleDateString("vi-VN", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
    }

    function openThread(id) {
      const p = posts.find((x) => x.id === id);
      if (!p) return;
      activePostId = id;
      document.getElementById("threadTitle").textContent = p.title;
      document.getElementById("threadSub").textContent =
        `${shipName(p.ship)} · ${deptLabel(p.dept)} · ${p.author} · ${p.time}` +
        (p.urgent ? " · GẤP" : "");
      document.getElementById("threadReplies").innerHTML = `
        <div class="bubble op">
          <div class="who">${escapeHtml(p.author)} · ${p.time}</div>
          <div>${escapeHtml(p.body)}</div>
        </div>
        ${p.replies
          .map(
            (r) => `
          <div class="bubble">
            <div class="who">${escapeHtml(r.author)} · ${r.time}</div>
            <div>${escapeHtml(r.text)}</div>
          </div>`
          )
          .join("")}`;
      document.getElementById("replyText").value = "";
      document.getElementById("threadOverlay").classList.add("open");
    }

    function openCompose(ship, dept) {
      composeTarget = { ship, dept };
      document.getElementById("composeSub").textContent = `${shipName(ship)} · ${deptLabel(dept)}`;
      document.getElementById("composeTitle").value = "";
      document.getElementById("composeBody").value = "";
      document.getElementById("composeUrgent").checked = false;
      document.getElementById("composeOverlay").classList.add("open");
    }

    function closeOverlays() {
      document.getElementById("threadOverlay").classList.remove("open");
      document.getElementById("composeOverlay").classList.remove("open");
      activePostId = null;
      composeTarget = null;
    }

    function setTvMode(on, persist) {
      document.body.classList.toggle("tv", on);
      document.getElementById("btnTv").textContent = on ? "Thoát chế độ Tivi" : "Chế độ Tivi";
      if (on) {
        // TV: mở Queen+Star, thu Pearl+Jade
        SHIPS.forEach((s) => setOpen(`ship-${s.id}`, !!s.openDefault));
      }
      if (persist) {
        const url = new URL(location.href);
        if (on) url.searchParams.set("tv", "1");
        else url.searchParams.delete("tv");
        history.replaceState(null, "", url);
      }
      renderAll();
    }

    function shouldAutoTv() {
      const q = new URLSearchParams(location.search);
      if (q.get("tv") === "1") return true;
      if (q.get("tv") === "0") return false;
      return window.innerWidth >= 1920 && window.innerHeight >= 1000;
    }

    document.getElementById("btnRefresh").addEventListener("click", () => {
      Object.keys(occupancy).forEach((shipId) => {
        Object.keys(occupancy[shipId]).forEach((z) => {
          const o = occupancy[shipId][z];
          o.guests = Math.max(0, Math.min(o.capacity, o.guests + Math.floor(Math.random() * 7) - 3));
        });
      });
      renderShips();
      stampSync();
    });

    document.getElementById("btnTv").addEventListener("click", () => {
      setTvMode(!document.body.classList.contains("tv"), true);
    });

    document.getElementById("btnExpandAll").addEventListener("click", () => {
      setOpen("officeBlock", true);
      SHIPS.forEach((s) => setOpen(`ship-${s.id}`, true));
    });

    document.getElementById("btnCollapseAll").addEventListener("click", () => {
      setOpen("officeBlock", false);
      SHIPS.forEach((s) => setOpen(`ship-${s.id}`, false));
    });

    document.addEventListener("click", (e) => {
      const toggle = e.target.closest("[data-toggle]");
      if (toggle && !e.target.closest("[data-compose],[data-open]")) {
        // ignore if clicking compose inside — but toggle is on head only
        const id = toggle.getAttribute("data-toggle");
        const el = document.getElementById(id);
        if (el && (e.target.closest(".office-head") || e.target.closest(".ship-head") || e.target.closest(".toggle-btn"))) {
          el.classList.toggle("open");
          syncToggleLabels();
        }
      }

      const open = e.target.closest("[data-open]");
      if (open) openThread(open.getAttribute("data-open"));

      const compose = e.target.closest("[data-compose]");
      if (compose) {
        const [ship, dept] = compose.getAttribute("data-compose").split("|");
        openCompose(ship, dept);
      }

      if (e.target.matches("[data-close]") || e.target.id === "threadOverlay") {
        if (e.target.id === "threadOverlay" || e.target.matches("[data-close]")) {
          document.getElementById("threadOverlay").classList.remove("open");
          activePostId = null;
        }
      }
      if (e.target.matches("[data-close-compose]") || e.target.id === "composeOverlay") {
        if (e.target.id === "composeOverlay" || e.target.matches("[data-close-compose]")) {
          document.getElementById("composeOverlay").classList.remove("open");
          composeTarget = null;
        }
      }
    });

    document.getElementById("btnReply").addEventListener("click", () => {
      const text = document.getElementById("replyText").value.trim();
      if (!text || !activePostId) return;
      const p = posts.find((x) => x.id === activePostId);
      p.replies.push({
        author: "Bạn (demo)",
        time: new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }),
        text,
      });
      openThread(activePostId);
      renderAll();
    });

    document.getElementById("btnCompose").addEventListener("click", () => {
      if (!composeTarget) return;
      const title = document.getElementById("composeTitle").value.trim();
      const body = document.getElementById("composeBody").value.trim();
      if (!title || !body) {
        alert("Nhập tiêu đề và nội dung.");
        return;
      }
      posts.unshift({
        id: "p" + Date.now(),
        ship: composeTarget.ship,
        dept: composeTarget.dept,
        title,
        body,
        urgent: document.getElementById("composeUrgent").checked,
        author: "Bạn (demo)",
        time: new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }),
        replies: [],
      });
      closeOverlays();
      renderAll();
    });

    document.getElementById("datePick").value = new Date().toISOString().slice(0, 10);
    setTvMode(shouldAutoTv(), false);
    renderAll();
    stampSync();
    tickClock();
    setInterval(tickClock, 1000);
  </script>
</body>
</html>
